name: PHPStan

on:
  push:
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpstan.neon.dist'
      - '.github/workflows/phpstan.yml'
  pull_request:
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpstan.neon.dist'
      - '.github/workflows/phpstan.yml'
  # A new Larastan/PHPStan release can fail this job on code nobody touched
  # (it did, on `Including.php`); the weekly run surfaces that on `main`.
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github
